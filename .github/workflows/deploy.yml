name: Deploy to GitHub Pages

# Publish the site to the gh-pages branch on every push to master
# (i.e. whenever a PR is merged into master). Can also be run manually.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the workflow to push to the gh-pages branch.
permissions:
  contents: write

# Never run two deploys at once; cancel an in-progress one if a newer push lands.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from the `packageManager` field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Use a current, maintained Chrome for prerendering instead of
      # react-snap's ancient bundled Chromium. This is what makes the
      # prerender reliable on modern runners.
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-dependencies: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The compile MUST succeed — this is the real build.
      # We skip the `postbuild` hook here so the prerender can't fail it.
      - name: Build
        run: pnpm exec react-scripts build
        env:
          CI: "true"

      # Prerender with react-snap, pointed at the Chrome installed above.
      # Best-effort: if it ever fails, we still publish the (un-prerendered)
      # build rather than failing the whole deploy.
      - name: Prerender (best-effort)
        continue-on-error: true
        run: pnpm exec react-snap
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          commit_message: "Deploy: ${{ github.event.head_commit.message }}"
