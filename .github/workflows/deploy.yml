name: Deploy to GitHub Pages

# Publish the site to the gh-pages branch on every push to master
# (i.e. whenever a PR is merged into master). Can also be run manually.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the workflow to push to the gh-pages branch.
permissions:
  contents: write

# Never run two deploys at once; cancel an in-progress one if a newer push lands.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from the `packageManager` field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec react-scripts build
        env:
          CI: "true"
          # Disable CRA's bundled ESLint webpack plugin during the build.
          # Under pnpm's symlinked layout it resolves eslint-config-react-app
          # via two paths and falsely reports `Plugin "react" was conflicted`,
          # which fails the build. Linting still runs in-editor / separately.
          DISABLE_ESLINT_PLUGIN: "true"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          commit_message: "Deploy: ${{ github.event.head_commit.message }}"
